<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Job Portal</h1>

    <div class="form">
        <h2>Search Jobs</h2>
        <form>
            <label for="job-title">Job Title:</label>
            <input type="text" id="job-title"><br><br>
            
            <label for="location">Location:</label>
            <input type="text" id="location"><br><br>
            
            <label for="category">Category:</label>
            <select id="category">
                <option value="">All Categories</option>
                <option value="technology">Technology</option>
                <option value="healthcare">Healthcare</option>
                <option value="education">Education</option>
                <option value="finance">Finance</option>
                <option value="marketing">Marketing</option>
            </select><br><br>
            
            <input type="submit" value="Search Jobs">
        </form>
    </div>


    <div class="jobs">
        <h2>Available Jobs</h2>
    </div>

    <div class="post">
        <h2>Post a Job</h2>

        <form>
            <label for="company-name">Company Name:</label>
            <input type="text" id="company-name"><br><br>
            
            <label for="job-position">Job Position:</label>
            <input type="text" id="job-position"><br><br>
            
            <label for="job-location">Job Location:</label>
            <input type="text" id="job-location"><br><br>
            
            <label for="job-description">Job Description:</label><br>
            <textarea id="job-description" rows="5" cols="50"></textarea><br><br>
            
            <label for="salary-range">Salary Range:</label>
            <input type="text" id="salary-range"><br><br>
            
            <input type="submit" value="Post Job">
        </form>
    </div>
    
    <footer>
        <p>&copy; 2026 Job Portal. All rights reserved.</p>
    </footer>
    <script src="job.js"></script>

</body>
